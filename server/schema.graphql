scalar Upload

type Query {
    medicalRecords(limit: Int, offset: Int): MedicalRecordsSubList
    medicalRecord(recordId: ID!): MedicalRecords
    user(userId: ID!): Users
    activePatientTokens: [Tokens]
    activeDoctorTokens: [Tokens]
    inactiveTokens(limit: Int, offset: Int): TokensSubList
    recordTypes: [RecordTypes]
    aiConversation: [Conversation]
    searchMedicalRecords(term: String!, languageCode: String): [SearchMedicalRecordsResult]
    searchFiles(term: String!): [SearchFilesResult]
    doctorPatients: [DoctorPatients]
    patientRecordsbyDoctor(limit: Int, offset: Int, patientId: ID!): MedicalRecordsSubList
}

type MedicalRecords {
    recordId: ID!
    recordData: String!
    dateCreated: String!
    recordType: RecordTypes!
    files: [Files]
    doctor: Doctors
}

type MedicalRecordsSubList {
    items: [MedicalRecords]
    totalCount: Int
}

type SearchMedicalRecordsResult {
    recordId: ID!
    recordData: String!
    dateCreated: String!
    doctorFullName: String
    patientFullName: String!
    recordTypeName: String
    recordTypeTranslations: [SearchRecordTypeTranslations]
    patientId: ID!
    doctorId: ID
}

type RecordTypes {
    recordTypeId: ID!
    recordName: String!
    translation: [RecordTypeTranslations]
}

type RecordTypeTranslations {
    translationId: ID!
    languageCode: String!
    translatedName: String!
}

type SearchRecordTypeTranslations {
    languageCode: String
    translatedName: String
    highlight: [String]
}

type Files {
    fileId: ID!
    fileName: String!
    mimeType: String!
    url: String!
    textContent: String
}

type SearchFilesResult {
    fileId: ID!
    recordId: ID!
    fileName: String!
    mimeType: String!
    url: String!
    textContent: String
    patientId: ID!
}

type Users {
    userId: ID!
    firstName: String!
    lastName: String!
    email: String!
    userType: String!
    password: String!
    acceptTerms: Boolean!
    patient: Patients
    doctor: Doctors
}

type Patients {
    patientId: ID!
    dateOfBirth: String
    gender: String
    user: Users
    tokens: [Tokens]
}

type Doctors {
    doctorId: ID!
    specialty: String
    licenseNumber: String
    user: Users
    tokensAccess: [TokenAccess]
}

type DoctorPatients {
    patientId: ID!
    patientFullName: String!
    lastRecordCreated: String!
}

type Conversation {
    role: String
    content: String
}

type Subscription {
  message: Conversation
}

type Mutation {
    createConversation(content: String!, allRecords: String!): ConversationResult
    createMedicalRecord(recordTypeId: ID!, recordData: String!): MedicalRecordResult
    createPatientOrDoctorUser(userId: ID!, userType: String!): UserConfirmation
    createRecordType(recordName: String!): RecordTypeResult
    createUser(input: CreateUserInput!): UserConfirmation
    deactivateToken(tokenId: ID!): DeactivateTokenResult
    generateToken(expirationDate: String!): TokenResult
    login(email: String!, password: String!): LoginResult
    multipleUpload(recordId: ID!, files: [Upload!]): MultipleUploadResult
    requestPasswordReset(email: String!, lang: String!): ResetResult
    resetPassword(token: String!, newPassword: String!): ResetResult
    saveTokenAccess(token: String!): TokenAccessResult
    updateDoctorUser(input: UpdateDoctorInput!): UserConfirmation
    updatePatientUser(input: UpdatePatientInput!): UserConfirmation
    updateUser(input: UpdateUserInput!): UserConfirmation
}

input CreateUserInput {
    firstName: String!
    lastName: String!
    email: String!
    userType: String!
    password: String!
    acceptTerms: Boolean!
}

input UpdateUserInput {
    firstName: String!
    lastName: String!
    email: String!
}

input UpdatePatientInput {
    dateOfBirth: String!
    gender: String!
}

input UpdateDoctorInput {
    specialty: String!
    licenseNumber: String!
}

type UserConfirmation {
    userConfirmation: String
    userError: String
    user: Users
    token: String
}

type LoginResult {
    user: Users
    error: String
    token: String
}

type Tokens {
    tokenId: ID!
    token: String!
    expirationDate: String!
    patient: Patients!
    tokenAccess: [TokenAccess]
}

type TokensSubList {
    items: [Tokens]
    totalCount: Int
}

type TokenResult {
    token: Tokens
    tokenConfirmation: String
    tokenError: String
}

type TokenAccess {
    tokenAccessId: ID!
    accessTime: String!
    token: Tokens
    doctor: Doctors
}

type TokenAccessResult {
    accessConfirmation: String
    accessError: String
    tokenAccess: TokenAccess
}

type ResetResult {
    resetConfirmation: String
    resetError: String
}

type RecordTypeResult {
    recordTypeConfirmation: String
    recordTypeError: String
    recordType: RecordTypes
}

type MedicalRecordResult {
    medicalRecordConfirmation: String
    medicalRecordError: String
    medicalRecord: MedicalRecords
}

type DeactivateTokenResult {
    deactivateTokenConfirmation: String
    deactivateTokenError: String
    token: Tokens
}

type MultipleUploadResult {
    fileConfirmation: String
    fileError: [String]
    files: [Files]
}

type ConversationResult {
    conversationConfirmation: String
    conversationError: String
    conversation: [Conversation]
}
